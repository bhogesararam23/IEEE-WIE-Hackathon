# Alembic configuration.
# Run commands from the backend/ directory:  alembic upgrade head
#
# The database URL is intentionally a placeholder here. env.py overwrites it
# with DATABASE_URL from the application settings so migrations and the running
# app can never drift apart.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

# Timestamped, descriptive migration filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# No [post_write_hooks] on purpose: Alembic runs hook executables strictly, so a
# missing `ruff` on PATH would abort `alembic revision` outright. Run
# `ruff format .` after generating a migration instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
