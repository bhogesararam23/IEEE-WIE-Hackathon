# Production stack for a single VM (Oracle Cloud Always Free, or any Docker
# host): the API (migrated automatically on start, no --reload, no source
# bind-mounts) + Caddy in front for automatic HTTPS.
#
# Postgres is NOT run here -- DATABASE_URL points at a managed Postgres
# (Neon, in this project's case). Set DB_SSL_REQUIRE=true in .env for that;
# see app/core/database.py for why it's a boolean flag rather than a URL
# query parameter.
#
# Usage on the VM:
#   cp .env.example .env   # then fill in real secrets -- see the deployment guide
#   docker compose -f docker-compose.prod.yml up --build -d

name: hermedisafe

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermedisafe-api
    restart: unless-stopped
    # Migrate on every start, then serve. Safe to repeat: Alembic no-ops once
    # the schema is already at head.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL_REQUIRE: ${DB_SSL_REQUIRE:-true}
      APP_NAME: ${APP_NAME:-HerMediSafe API}
      ENVIRONMENT: production
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
      SECRET_KEY: ${SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      PUBMED_API_KEY: ${PUBMED_API_KEY:-}
    volumes:
      # Named volume, not a bind mount of source: the image's baked-in code
      # runs as built. This one is for uploaded prescription files, so they
      # survive a container restart/redeploy instead of vanishing with the
      # container filesystem.
      - hermedisafe_storage:/app/storage

  caddy:
    image: caddy:2-alpine
    container_name: hermedisafe-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  hermedisafe_storage:
    name: hermedisafe_storage
  caddy_data:
    name: hermedisafe_caddy_data
  caddy_config:
    name: hermedisafe_caddy_config
